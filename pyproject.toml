[project]
name = "arete"
version = "3.0.1"
description = "A robust, fast, and feature-rich CLI for syncing Obsidian vault to Anki."
readme = "README.md"
license = "GPL-3.0"
authors = [
    { name = "Adam Nguyen", email = "AdanatoNw@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["obsidian", "anki", "sync", "spaced-repetition"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
dependencies = [
    "pyyaml>=6.0.3",
    "tqdm>=4.67.1",
    "markdown>=3.10",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-settings[toml]>=2.12.0",
    "typer>=0.21.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "anki==25.9.2",
    "python-ulid>=3.0.0",
    "networkx>=3.0",
    "mcp[cli]>=2.2,<3",
]

[project.urls]
Repository = "https://github.com/adamtrnguyen/Arete"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff==0.17.2",
    "pre-commit>=3.5.0",
    "rust-just>=1.46.0",
    "pytest-asyncio>=1.3.0",
    "respx>=0.22.0",
    "pytest-cov>=7.0.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "import-linter>=2.1.0",
    "pyright==1.1.411",
    "build>=1.4.0",
    "coverage-badge>=1.1.2",
    "pyinstrument>=5.1.2",
    "pytest-deduplicate>=0.1.6",
    "docker>=7.1.0",
    "hypothesis>=6.151.9",
    "requests>=2.31.0",
    "vulture>=2.16",
    "pytest-xdist>=3.8.0",
]

[tool.importlinter]
root_package = "arete"

[[tool.importlinter.contracts]]
name = "Domain Driven Architecture Layers"
type = "layers"
layers = [
    "interface",
    "composition",
    "application",
    "infrastructure",
    "domain",
]
containers = ["arete"]

[[tool.importlinter.contracts]]
name = "Interfaces reach adapters only through the composition root"
type = "forbidden"
source_modules = ["arete.interface"]
forbidden_modules = ["arete.infrastructure"]
# The chain interface -> composition -> infrastructure is the point; only DIRECT imports are forbidden.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Application level isolation"
type = "forbidden"
source_modules = ["arete.application"]
forbidden_modules = ["arete.infrastructure.adapters"]

[[tool.importlinter.contracts]]
name = "Domain isolation"
type = "forbidden"
source_modules = ["arete.domain"]
forbidden_modules = ["arete.infrastructure", "arete.application", "arete.interface"]

[tool.hatch.build.targets.wheel]
packages = ["src/arete"]
exclude = ["mock_vault", "docker", "obsidian-plugin", "docs"]

[tool.hatch.build.targets.sdist]
exclude = ["mock_vault", "docker", "obsidian-plugin", "docs"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "docker/anki_data",
    "ankiconnect",
    "anki-plugin",
    "arete_ankiconnect",
    "tests/fixtures",
    "obsidian-plugin",
]

[tool.ruff.lint]
# E: pycodestyle errors
# F: Pyflakes
# I: isort
# B: flake8-bugbear
# C4: flake8-comprehensions
# UP: pyupgrade
# W: pycodestyle warnings
# C901: mccabe complexity
# D: pydocstyle (documentation)
# FIX: flake8-fixme (TODO detection)
select = ["E", "F", "I", "B", "C4", "UP", "W", "TID252", "C901", "D", "FIX", "S110", "S112"]
ignore = ["D100", "D101", "D102", "D103", "D104"] # We will enable these selectively below

[tool.ruff.lint.pydocstyle]
# One convention resolves the D203/D211 and D212/D213 pairs that made the gate unpassable.
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501"]
"src/arete/domain/**/*.py" = ["D100", "D101", "D102", "D103", "D104"]

# C901 debt, pinned file by file so a complex function in any other file still fails the
# gate. Each entry is a promise to split that file, not permission to grow it; remove an
# entry as soon as its file is under the limit. The debt: `uv run ruff check --select C901
# --isolated src`. History: docs/history/qa-gate.md.
"src/arete/application/queue/builder.py" = ["C901"]
"src/arete/application/queue/graph_resolver.py" = ["C901"]
"src/arete/application/queue/service.py" = ["C901"]
"src/arete/application/sync/converter.py" = ["C901"]
"src/arete/application/sync/parser.py" = ["C901"]
"src/arete/application/sync/pipeline.py" = ["C901"]
"src/arete/application/sync/vault_service.py" = ["C901"]
"src/arete/application/utils/text.py" = ["C901"]
"src/arete/infrastructure/adapters/stats/connect_stats.py" = ["C901"]
"src/arete/infrastructure/anki/repository.py" = ["C901"]
"src/arete/interface/cli.py" = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[project.scripts]
arete = "arete.interface.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring a running Anki instance",
]

[tool.vulture]
paths = ["src", "scripts"]
# At 60% vulture flags every typer command, FastAPI route, MCP tool and pydantic field, all
# registered by decorator or read by key; 80% keeps only names nothing can reach.
min_confidence = 80
# Parameters a protocol requires by position, never read in the body:
# pydantic-settings' settings_customise_sources (config.py) and a context manager's __exit__.
ignore_names = ["dotenv_settings", "file_secret_settings", "exc_type", "exc_val", "exc_tb"]

[tool.coverage.report]
fail_under = 85
show_missing = true
omit = ["tests/*"]
