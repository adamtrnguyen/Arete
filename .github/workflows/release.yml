name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and create GitHub Release
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Fail if the tag disagrees with the pyproject version
      run: |
        BUILT=$(grep -m1 -E '^version *= *"' pyproject.toml | cut -d'"' -f2)
        TAG="${GITHUB_REF_NAME#v}"
        if [ "$BUILT" != "$TAG" ]; then
          echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $BUILT"
          exit 1
        fi
        echo "tag $GITHUB_REF_NAME matches version $BUILT"

    - name: Install uv
      uses: astral-sh/setup-uv@v10.4.0
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --dev

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Install plugin dependencies
      run: npm ci --legacy-peer-deps
      working-directory: obsidian-plugin

    # One recipe builds every artifact, here and on a laptop, so the two cannot
    # drift. It verifies (lint, types, import contracts, generated docs, version
    # agreement, both test suites), builds the wheel, the plugin and the Anki
    # add-on, then runs the built wheel's console script. The plugin shells out
    # to `arete`, so a wheel that builds without exposing that entry point is a
    # broken release.
    - name: Build and verify every artifact
      run: uv run just release

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        generate_release_notes: true
        files: |
          dist/*.whl
          dist/*.tar.gz
          obsidian-plugin/main.js
          obsidian-plugin/manifest.json
          obsidian-plugin/styles.css
          release_artifacts/arete_ankiconnect.zip
          release_artifacts/arete_ankiconnect.ankiaddon

    - name: Upload Anki Add-on Artifact
      uses: actions/upload-artifact@v7
      with:
        name: anki-addon
        path: release_artifacts/arete_ankiconnect.zip
