name: Release to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write  # Required for trusted publishing to PyPI

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --dev

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install plugin dependencies
      run: npm ci --legacy-peer-deps
      working-directory: obsidian-plugin

    # One recipe builds every artifact, here and on a laptop, so the two cannot
    # drift. It verifies (lint, types, import contracts, generated docs, version
    # agreement, both test suites), stamps the pyproject version into every
    # manifest, builds the wheel, the plugin and the Anki add-on, then runs the
    # built wheel's console script. The plugin shells out to `arete`, so a wheel
    # that builds without exposing that entry point is a broken release.
    - name: Build and verify every artifact
      run: uv run just release

    - name: Fail if the tag disagrees with the built version
      run: |
        BUILT=$(uv run python -c "import re,pathlib;print(re.search(r'^version\s*=\s*"([^"]+)"', pathlib.Path('pyproject.toml').read_text(), re.M).group(1))")
        TAG="${GITHUB_REF_NAME#v}"
        if [ "$BUILT" != "$TAG" ]; then
          echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $BUILT"
          exit 1
        fi
        echo "tag $GITHUB_REF_NAME matches version $BUILT"

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      # Best-effort: a PyPI hiccup (e.g. trusted-publishing/version) must never
      # block the GitHub Release below, which is what BRAT installs from.
      continue-on-error: true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        generate_release_notes: true
        files: |
          dist/*.whl
          dist/*.tar.gz
          obsidian-plugin/main.js
          obsidian-plugin/manifest.json
          obsidian-plugin/styles.css
          release_artifacts/arete_ankiconnect.zip
          release_artifacts/arete_ankiconnect.ankiaddon

    - name: Upload Anki Add-on Artifact
      uses: actions/upload-artifact@v4
      with:
        name: anki-addon
        path: release_artifacts/arete_ankiconnect.zip


