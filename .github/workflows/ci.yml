name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.4.0
      with:
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --dev

    - name: Run tests with coverage
      # -rfEs: the failures and errors, and every skipped test with its reason, per OS.
      run: uv run just coverage -rfEs

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.4.0
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --dev

    - name: Lint
      run: uv run just lint

    - name: Format Check
      run: uv run just fmt-check

    - name: Type Check
      run: uv run just check-types

    - name: Import contracts
      run: uv run just layers

    - name: Dead code
      run: uv run just dead

    - name: Generated docs
      run: uv run just check-docs

    - name: Version agreement
      run: uv run just check-versions

  plugin:
    name: Obsidian Plugin (Build & Test on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows too: the plugin starts Arete with Windows paths, separators and executables there.
        os: [ubuntu-latest, windows-latest]
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Install Dependencies
      run: |
        cd obsidian-plugin
        # Required until eslint-plugin-obsidianmd's transitive plugins declare ESLint 10 peers.
        npm ci --legacy-peer-deps

    - name: Lint
      run: |
        cd obsidian-plugin
        npm run lint

    - name: Format Check
      run: |
        cd obsidian-plugin
        npm run fmt:check

    - name: Lint Imports
      run: |
        cd obsidian-plugin
        npm run lint:deps

    - name: Min App Version
      run: |
        cd obsidian-plugin
        npm run check:min-app-version

    - name: Type Check
      run: |
        cd obsidian-plugin
        npx tsc --noEmit

    - name: Test
      run: |
        cd obsidian-plugin
        npm test -- --coverage

    - name: Build
      run: |
        cd obsidian-plugin
        npm run build

  integration:
    name: Integration Tests (${{ matrix.network_mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        network_mode: [bridge, host]
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.4.0
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --dev

    - name: Start Anki (${{ matrix.network_mode }})
      run: |
        if [ "${{ matrix.network_mode }}" == "host" ]; then
          uv run just setup-anki-data
          docker compose -f docker/docker-compose.host.yml up -d
          echo "ANKI_CONNECT_URL=http://127.0.0.1:8765" >> $GITHUB_ENV
        else
          uv run just docker-up
          echo "ANKI_CONNECT_URL=http://127.0.0.1:8766" >> $GITHUB_ENV
        fi

    - name: Wait for Anki
      run: uv run just wait-for-anki

    - name: Debug Anki Logs and State
      if: failure()
      run: |
        docker logs anki-test
        echo "=== Container Process List ==="
        docker exec anki-test ps aux || echo "ps failed"
        echo "=== Container File System (Search for addons) ==="
        docker exec anki-test find / -name "addons21" -type d || echo "find failed"
        echo "=== Config Directory Contents ==="
        docker exec anki-test ls -R /config || echo "ls failed"
        echo "=== Network Listening Ports ==="
        docker exec anki-test netstat -tulpn || echo "netstat failed (trying ss)"
        docker exec anki-test ss -tulpn || echo "ss failed"

    - name: Run integration tests
      run: uv run just test-integration

    - name: Stop Docker
      if: always()
      run: |
        if [ "${{ matrix.network_mode }}" == "host" ]; then
          uv run just docker-down docker/docker-compose.host.yml
        else
          uv run just docker-down docker/docker-compose.yml
        fi
