site_name: Arete
site_description: "One-way sync from an Obsidian vault to Anki."
site_url: "https://adamtrnguyen.github.io/Arete/"
repo_url: "https://github.com/adamtrnguyen/Arete"

theme:
  name: material
  features:
    - content.code.copy

# Only user-facing pages are published. Developer docs and history stay in the repo.
nav:
  - Start: index.md
  - Card schema: cards.md
  - Writing cards: format.md
  - CLI: CLI.md
  - Obsidian plugin: PLUGIN.md
  - Troubleshooting: TROUBLESHOOTING.md

exclude_docs: |
  ARCHITECTURE.md
  CONTRIBUTING.md
  ANKI_PLUGIN.md
  publishing.md
  history/

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true
